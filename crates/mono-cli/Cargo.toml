[package]
name = "mono-cli"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Command-line entry point for mono"

[[bin]]
name = "mono"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
walkdir = "2"

[dependencies]
clap = { version = "4", features = ["derive"] }
mono-cache = { path = "../mono-cache" }
mono-core = { path = "../mono-core" }
mono-discover = { path = "../mono-discover" }
mono-graph = { path = "../mono-graph" }
mono-task = { path = "../mono-task" }
thiserror = "2"
